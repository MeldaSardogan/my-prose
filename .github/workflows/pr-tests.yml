name: PR Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java and Maven authentication
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: MeldaSardogan
          server-password: MAVEN_TOKEN

      - name: Check package token
        shell: bash
        env:
          PACKAGE_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$PACKAGE_TOKEN" ]; then
            echo "::error::The repository secret GH_PACKAGES_TOKEN is missing."
            exit 1
          fi

      - name: Run Maven tests
        env:
          MAVEN_USERNAME: DEIN_GITHUB_USERNAME
          MAVEN_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: mvn -B -U --no-transfer-progress clean test