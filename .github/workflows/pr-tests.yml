name: PR Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out My Prose
        uses: actions/checkout@v4

      - name: Check out Prose Builder
        uses: actions/checkout@v4
        with:
          repository: bs-jokri/prose-builder
          ref: 1.0.0
          path: vendor/prose-builder

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            vendor/prose-builder/pom.xml

      - name: Install Prose Builder locally
        run: >
          mvn -B
          --no-transfer-progress
          --file vendor/prose-builder/pom.xml
          clean install
          -DskipTests

      - name: Run My Prose tests
        run: >
          mvn -B
          --no-transfer-progress
          clean test